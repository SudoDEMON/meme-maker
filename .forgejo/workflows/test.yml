name: Media checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: linux-cpu
    timeout-minutes: 20
    steps:
      - uses: https://github.com/actions/checkout@v6
        with:
          persist-credentials: false
      - uses: https://github.com/actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig fonts-dejavu-core ca-certificates fonts-liberation libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libcups2t64 libdbus-1-3 libdrm2 libgbm1 libgtk-3-0t64 libnspr4 libnss3 libx11-xcb1 libxcomposite1 libxdamage1 libxfixes3 libxkbcommon0 libxrandr2
      - run: npm ci
      - name: Install Puppeteer bundled browsers
        run: npx --no-install puppeteer browsers install
      - run: npm run check
