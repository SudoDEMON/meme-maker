name: Media checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: linux-cpu
    timeout-minutes: 20
    steps:
      - uses: https://github.com/actions/checkout@v6
        with:
          persist-credentials: false
      - uses: https://github.com/actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig fonts-dejavu-core chromium
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - run: npm run check
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
